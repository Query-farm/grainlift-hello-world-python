name: Python hello world

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native example (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed native driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Query-farm/grainlift
          ref: 24216c2b720bcb66c29d8e2dcb64cca9d0daa431
          path: native-driver
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.11.7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.1
      - run: uv sync --locked --python '${{ matrix.python }}'
      - name: Check example style
        run: |
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests
      - name: Build the native ADBC driver
        working-directory: native-driver
        run: cargo build --locked -p adbc-driver-grainlift
      - name: Build distributions and install the example wheel
        run: |
          uv build
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Test the installed example through the native driver
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.dylib" ;;
            Linux) export GRAINLIFT_DRIVER="$PWD/native-driver/target/debug/libadbc_driver_grainlift.so" ;;
            *) exit 1 ;;
          esac
          test -f "$GRAINLIFT_DRIVER"
          uv run --no-sync python - <<'PY'
          import pathlib
          import sys
          import grainlift_hello_world
          package = pathlib.Path(grainlift_hello_world.__file__).resolve()
          assert package.is_relative_to(pathlib.Path(sys.prefix).resolve()), package
          assert "site-packages" in package.parts, package
          PY
          uv run --no-sync python -m pytest tests -q --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hello-world-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
