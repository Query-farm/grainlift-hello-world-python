[project]
name = "grainlift-hello-world-python"
version = "0.1.0"
description = "A Python-authored ADBC hello-world service"
requires-python = ">=3.13"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["grainlift-python", "adbc-driver-manager>=1.7"]

[project.scripts]
grainlift-hello-world = "grainlift_hello_world:main"
grainlift-hello-client = "grainlift_hello_world.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grainlift_hello_world"]

[tool.hatch.build]
exclude = [
    "**/.git", "**/.claude", "**/.codex", "**/.agents", "**/.hypothesis",
    "**/.venv", "**/venv", "**/__pycache__", "**/.mypy_cache", "**/.ruff_cache", "**/.pytest_cache",
    "**/*.pyc", "**/.env*", "**/*.pem", "**/*.key", "**/*.crt", "**/*.cer", "**/*.p12", "**/*.pfx",
    "**/credentials", "**/credentials.json", "**/secrets.json", "**/id_rsa", "**/id_ed25519",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv.sources]
grainlift-python = { git = "https://github.com/Query-farm/grainlift-python.git", rev = "127afc36e5f980814ee5a7536ca05fe43c9d3656" }
vgi-rpc = { git = "https://github.com/Query-farm/vgi-rpc-python.git", rev = "cf0564f0ea9780ffbbff18995b3d027d3aa41d75" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
