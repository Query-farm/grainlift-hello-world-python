[project]
name = "grainlift-hello-world-python"
version = "0.1.0"
description = "A Python-authored ADBC hello-world service"
requires-python = ">=3.13"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["grainlift-python[granian]", "adbc-driver-manager>=1.7"]

[project.scripts]
grainlift-hello-world = "grainlift_hello_world:main"
grainlift-hello-client = "grainlift_hello_world.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grainlift_hello_world"]

[tool.hatch.build]
exclude = [
    "**/.git", "**/.claude", "**/.codex", "**/.agents", "**/.hypothesis",
    "**/.venv", "**/venv", "**/__pycache__", "**/.mypy_cache", "**/.ruff_cache", "**/.pytest_cache",
    "**/*.pyc", "**/.env*", "**/*.pem", "**/*.key", "**/*.crt", "**/*.cer", "**/*.p12", "**/*.pfx",
    "**/credentials", "**/credentials.json", "**/secrets.json", "**/id_rsa", "**/id_ed25519",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "pyarrow-stubs"]

[tool.uv.sources]
grainlift-python = { git = "https://github.com/Query-farm/grainlift-python.git", rev = "05e84a5b75cde760cd0f6554fe4c372671bd80df" }

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's `D` rules, which only check
# docstring *shape*, not whether documented args/attributes match the code).
# pydoclint is not a project dependency; run it isolated:
#   uvx pydoclint --config pyproject.toml src/ tests/
style = "google"
# Types live in signatures, not docstrings.
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
skip_checking_raises = true
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# granian ships no stubs.
module = "granian.*"
ignore_missing_imports = true
